<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 2.2" width="300" height="2.2">
  <title>Time / instructions bar at 100 % (the gradient drains towards the right); units: wall cm</title>
  <defs>
    <linearGradient id="brand-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#004C6A"/>
      <stop offset="1" stop-color="#00A796"/>
    </linearGradient>
  </defs>
  <rect id="track" x="0" y="0" width="300" height="2.2" fill="#CED8DE"/>
  <rect id="fill" x="0" y="0" width="300" height="2.2" fill="url(#brand-gradient)"/>
</svg>
