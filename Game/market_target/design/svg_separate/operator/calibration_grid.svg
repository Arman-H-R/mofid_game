<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500px" height="2000px" viewBox="0 0 300 400">
<title>Calibration grid; 1 unit = 1 cm on the wall</title>
<g id="Grid" stroke="#3D8DB2" stroke-width="0.2">
<line x1="0" y1="0" x2="0" y2="400"/>
<line x1="50" y1="0" x2="50" y2="400"/>
<line x1="100" y1="0" x2="100" y2="400"/>
<line x1="150" y1="0" x2="150" y2="400"/>
<line x1="200" y1="0" x2="200" y2="400"/>
<line x1="250" y1="0" x2="250" y2="400"/>
<line x1="300" y1="0" x2="300" y2="400"/>
<line x1="0" y1="0" x2="300" y2="0"/>
<line x1="0" y1="50" x2="300" y2="50"/>
<line x1="0" y1="100" x2="300" y2="100"/>
<line x1="0" y1="150" x2="300" y2="150"/>
<line x1="0" y1="200" x2="300" y2="200"/>
<line x1="0" y1="250" x2="300" y2="250"/>
<line x1="0" y1="300" x2="300" y2="300"/>
<line x1="0" y1="350" x2="300" y2="350"/>
<line x1="0" y1="400" x2="300" y2="400"/>
</g>
</svg>
